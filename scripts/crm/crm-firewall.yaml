        crm:
            host: '^crm\.(oling\.fr|localhost)$'
            lazy: true
            provider: app_user_provider
            login_throttling:
                max_attempts: 5
                interval: '15 minutes'
            form_login:
                login_path: admin_crm_login
                check_path: admin_crm_login
                enable_csrf: true
                default_target_path: admin_crm
                always_use_default_target_path: true
            logout:
                path: admin_crm_logout
                target: admin_crm_login
                enable_csrf: true
