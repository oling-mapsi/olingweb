services_index.amoa.intro: 'ERP, CRM, CMMS, finance, HR, data and AI: requirements, selection, acceptance testing and deployment.'
services_index.amoa.items.amoa_si: Define requirements, organise tenders and oversee acceptance testing and deployment.
services_index.amoa.items.erp: Select software, define processes, prepare data migration and coordinate the integrator.
services_index.amoa.items.crm: Define sales processes, customer data, adoption and reporting.
services_index.amoa.items.gmao: Define maintenance processes, assets, equipment data, mobile use and acceptance testing.
services_index.amoa.items.finance: Connect finance processes, ERP/EPM, reporting, internal controls and interfaces.
services_index.amoa.items.e_invoice: Define invoice flows, formats, platforms, IT impacts and change management.
services_index.amoa.items.data_bi: Define indicators, data models, dashboards and reporting requirements.
services_index.amoa.items.ai_automation: Identify use cases, automate processes and integrate business agents.
services_index.governance.intro: Organise IT governance, prioritise work and manage delivery.
services_index.governance.items.strategy: Define target systems, priorities, budgets and the implementation roadmap.
services_index.governance.items.pmo: Track schedules, budgets, risks, suppliers and project decisions.
services_index.governance.items.process: Clarify responsibilities, processes and working practices.
services_index.governance.items.data_governance: Define master data, quality requirements, business rules and responsibilities.
services_index.governance.items.infrastructure: Assess technical options, risks, schedules and transition governance.
services_index.governance.items.dsi: Support IT management on priorities, suppliers, budgets and business continuity.
services_index.risk.intro: 'GDPR, cybersecurity, QHSE, continuity, internal control and AI: obligations, controls and action plans.'
services_index.risk.items.rgpd: Manage records, DPIAs, contracts, rights requests and DPO governance.
services_index.risk.items.cyber: Organise security governance, risk management, ISO 27001, NIS2 and DORA work.
services_index.risk.items.pca: Identify critical activities, define recovery objectives and test continuity plans.
services_index.risk.items.qse: Organise processes, audits, nonconformities and certification preparation.
services_index.risk.items.risk_control: Map risks, test controls and monitor action plans.
services_index.risk.items.ai_act: Define AI use cases, responsibilities, risks, human oversight and evidence.
services_index.mapsi.intro: OLING's GRC platform for records, risks, audits, actions, incidents and reporting.
