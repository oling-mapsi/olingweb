<!doctype html><html lang="fr"><meta charset="utf-8"><title>Recette Kanban — fixtures locales</title>
<style>body{font:16px system-ui;margin:24px;background:#f4f7fb;color:#172c3a}iframe{width:100%;height:720px;border:1px solid #b7c6d3}li{padding:4px}.pass{color:#21613f}.fail{color:#9c3429}</style>
<h1>Recette des zones de clôture</h1><p>Données fictives. Requêtes interceptées en mémoire ; aucun accès à une API réelle.</p><button id="run">Exécuter les tests</button><ol id="results"></ol><iframe title="Kanban fictif"></iframe>
<script>
const results=document.querySelector('#results'), frame=document.querySelector('iframe');
const assert=(value,message)=>{if(!value)throw Error(message)};
const settle=()=>new Promise(resolve=>setTimeout(resolve,50));
async function fixture(){
 await new Promise(resolve=>{frame.onload=resolve;frame.src='/index.html?view=portfolio&segment=clients&q=Alpha&scope=active&fixture='+Date.now();});
 const w=frame.contentWindow,d=w.document;let calls=[],resolve;
 w.fetch=(url,options)=>{calls.push({url:String(url),options});return new Promise(r=>resolve=r)};
 const card=()=>d.querySelector('.deal-card'),target=s=>d.querySelector('[data-close-status="'+s+'"]');
 const event=(el,type)=>el.dispatchEvent(new w.DragEvent(type,{bubbles:true,cancelable:true,dataTransfer:new w.DataTransfer()}));
 const start=()=>event(card(),'dragstart');const drop=s=>{event(target(s),'dragover');event(target(s),'drop')};
 const reply=async(data,status=200,redirected=false)=>{resolve({ok:status<400,status,redirected,json:async()=>data});await settle()};
 return {w,d,calls,card,target,event,start,drop,reply};
}
const tests=[
 ['Dépôt perdu, verrouillage et double dépôt',async()=>{const f=await fixture();f.start();f.event(f.target('lost'),'dragover');assert(f.target('lost').classList.contains('drop-target'),'retour drag-over');f.drop('lost');f.drop('lost');f.start();f.drop('won');assert(f.calls.length===1,'une seule requête');assert(f.card().closest('.lane').dataset.value==='sent','carte conservée pendant la requête');assert(f.target('lost').getAttribute('aria-busy')==='true','chargement');assert(new URLSearchParams(f.calls[0].options.body).get('status')==='lost','statut métier perdu');await f.reply({saved:true,version:3,closed_counts:{lost:2,won:1}});assert(!f.card(),'carte retirée après succès');assert(f.d.querySelector('[data-closed-count="lost"]').textContent==='2','compteur serveur exact');assert(f.d.querySelector('[data-board-total]').textContent==='0','total Kanban');assert(!f.target('lost').hasAttribute('aria-busy'),'chargement terminé');}],
 ['Dépôt gagné et contexte des filtres',async()=>{const f=await fixture();f.start();f.drop('won');assert(new URLSearchParams(f.calls[0].options.body).get('status')==='won','statut métier gagné');assert(new URL(f.calls[0].url).searchParams.get('q')==='Alpha','recherche envoyée au serveur');assert(new URL(f.calls[0].url).searchParams.get('segment')==='clients','segment envoyé au serveur');await f.reply({saved:true,version:3,closed_counts:{lost:1,won:2}});assert(f.d.querySelector('[data-closed-count="won"]').textContent==='2','compteur gagné');}],
 ['Conflit 409 : carte et compteurs conservés, nouvel essai possible',async()=>{const f=await fixture();f.start();f.drop('lost');await f.reply({error:'Version modifiée. Rechargez.'},409);assert(f.card().closest('.lane').dataset.value==='sent','carte conservée');assert(f.d.querySelector('[data-closed-count="lost"]').textContent==='1','compteur inchangé');assert(!f.d.querySelector('#save-error').hidden,'erreur visible');f.start();f.drop('lost');assert(f.calls.length===2,'nouvel essai disponible');}],
 ['Permission 403 : erreur et commandes désactivées',async()=>{const f=await fixture();f.start();f.drop('won');await f.reply({},403);assert(f.card(),'carte conservée');assert(!f.card().draggable,'drag désactivé');assert(f.card().querySelector('.card-status').disabled,'clavier désactivé');f.start();f.drop('lost');assert(f.calls.length===1,'aucun second appel');}],
 ['Session redirigée : carte conservée',async()=>{const f=await fixture();f.start();f.drop('won');await f.reply({},200,true);assert(f.card(),'carte conservée');assert(f.d.querySelector('#save-error').textContent.includes('Session'),'message de session');}],
 ['Erreur réseau : carte et compteur inchangés',async()=>{const f=await fixture();f.w.fetch=()=>Promise.reject(Error('Connexion interrompue'));f.start();f.drop('won');await settle();assert(f.card(),'carte conservée');assert(f.d.querySelector('[data-closed-count="won"]').textContent==='1','compteur inchangé');assert(!f.d.querySelector('#save-error').hidden,'erreur réseau visible');}],
 ['Annulation par Échap et fin du drag',async()=>{const f=await fixture();f.start();f.event(f.target('won'),'dragover');f.d.dispatchEvent(new f.w.KeyboardEvent('keydown',{key:'Escape',bubbles:true}));f.drop('won');assert(f.calls.length===0,'annulation sans requête');assert(!f.d.querySelector('.drop-target'),'surbrillance effacée');f.start();f.event(f.d,'dragend');f.drop('lost');assert(f.calls.length===0,'fin sans dépôt');}],
 ['Drag entre colonnes existant',async()=>{const f=await fixture();const lane=f.d.querySelector('.lane[data-value="discussion"]');f.start();f.event(lane,'dragover');f.event(lane,'drop');await f.reply({saved:true,version:3,closed_counts:{lost:1,won:1}});assert(f.card().closest('.lane')===lane,'carte déplacée dans la colonne');assert(f.d.querySelector('[data-closed-count="won"]').textContent==='1','clôtures inchangées');}],
 ['Alternative clavier et export CSV conservés',async()=>{const f=await fixture();f.card().querySelector('.card-details-toggle').click();const select=f.card().querySelector('.card-status');select.focus();select.value='won';select.dispatchEvent(new f.w.Event('change',{bubbles:true}));await f.reply({saved:true,version:3,closed_counts:{lost:1,won:2}});assert(!f.card(),'clôture clavier');assert(f.d.activeElement===f.d.querySelector('select[name="scope"]'),'focus restauré');assert(f.d.querySelector('a[href="/admin/crm/export.csv"]'),'export conservé');}]
];
document.querySelector('#run').onclick=async()=>{results.innerHTML='';let passed=0;for(const [name,test] of tests){const li=document.createElement('li');results.append(li);try{await test();li.className='pass';li.textContent='✓ '+name;passed++}catch(e){li.className='fail';li.textContent='✗ '+name+' — '+e.message}}document.title=`${passed}/${tests.length} tests — Kanban`;};
</script></html>
