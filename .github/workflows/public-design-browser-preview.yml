name: OLING public design — isolated browser preview

on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/**'
      - 'src/**'
      - 'templates/**'
      - 'translations/**'
      - 'data/i18n/**'
      - 'scripts/audit-public-visual-theme.mjs'
      - 'scripts/ci/prepare-public-design-preview.mjs'
      - '.github/workflows/public-design-browser-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-preview:
    name: Build isolated Symfony preview and upload screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: CIOnlyPreviewPassword
          MYSQL_DATABASE: oling_preview
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pCIOnlyPreviewPassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8

    env:
      APP_ENV: prod
      APP_DEBUG: '0'
      APP_SECRET: isolated-public-design-preview-ci
      DATABASE_URL: 'mysql://root:CIOnlyPreviewPassword@127.0.0.1:3306/oling_preview?serverVersion=8.0.35&charset=utf8mb4'
      MAILER_DSN: 'null://null'
      MESSENGER_TRANSPORT_DSN: 'sync://'
      OLING_AUDIT_BASE_URL: 'http://127.0.0.1:8753'
      OLING_AUDIT_ROUTES: '/a-propos,/a-propos/team,/en/about,/en/team,/es/quienes-somos,/es/equipo,/expertises,/services,/secteurs,/projets,/ressources,/contact'
      OLING_AUDIT_WIDTHS: '390,768,1366,1920'
      OLING_AUDIT_FIXTURE_LABEL: 'GitHub Actions : base MySQL temporaire et contenus publics versionnes, sans donnees de production'

    steps:
      - name: Checkout PR without production credentials
        uses: actions/checkout@v4

      - name: PHP 8.3 + MySQL extension
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, ctype, iconv, pdo_mysql, gd, zip
          coverage: none
          tools: composer:v2

      - name: Install PHP deps in disposable runner
        run: |
          rm -rf vendor
          composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Compile production-like frontend assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Migrate temporary CI database (never production)
        run: php bin/console doctrine:migrations:migrate --no-interaction

      - name: Populate temporary local content from versioned repository sources
        run: |
          php bin/console app:content:seed-public-pages
          php bin/console app:i18n:backfill-core-pages --create-missing --overwrite
          node scripts/ci/prepare-public-design-preview.mjs
          php bin/console app:i18n:import-translations --locale=en --entity=SitePage --input=var/public-design-preview/site-pages.en.json --overwrite
          php bin/console app:i18n:import-translations --locale=es --entity=SitePage --input=var/public-design-preview/site-pages.es.json --overwrite

      - name: Start isolated Symfony preview
        run: |
          nohup php -S 127.0.0.1:8753 -t public tests/e2e/php-router.php > /tmp/oling-preview-server.log 2>&1 &
          echo $! > /tmp/oling-preview-server.pid
          for n in $(seq 1 20); do
            if curl -sS -o /tmp/oling-preview-about.html -w '%{http_code}' http://127.0.0.1:8753/a-propos | grep -qx '200'; then
              echo "Symfony About page serves HTTP 200"
              break
            fi
            sleep 2
          done
          curl --fail --silent --show-error http://127.0.0.1:8753/a-propos > /dev/null
          curl --fail --silent --show-error http://127.0.0.1:8753/a-propos/team > /dev/null

      - name: Install real Chromium browser for screenshots
        run: npx playwright install --with-deps chromium

      - name: Capture actual browser screenshots and QA report
        run: npm run audit:public-visual

      - name: Copy server diagnostics if capture fails
        if: failure()
        run: |
          mkdir -p docs/redesign
          cp /tmp/oling-preview-server.log docs/redesign/preview-server.log || true

      - name: Upload visual gallery and browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oling-design-preview-gallery
          path: |
            docs/redesign/preview.html
            docs/redesign/PUBLIC_THEME_AUDIT.md
            docs/redesign/PUBLIC_THEME_AUDIT.json
            docs/redesign/screenshots-public-design/**
            docs/redesign/preview-server.log
          retention-days: 14
          if-no-files-found: warn

      - name: No production release
        if: always()
        run: echo "Isolated preview only; no merge, deployment, production database or production data touched."
