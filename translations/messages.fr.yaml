    intro: "ERP, CRM, GMAO, SI Finance, SIRH, data et IA : cadrage, choix d’outils, recette, migration et mise en production."
    items:
      amoa_si: "Cadrer le besoin, organiser la consultation, piloter la recette et sécuriser la mise en production."
      erp: "Choisir le progiciel, cadrer les processus, préparer la reprise de données et piloter l’intégrateur."
      crm: "Structurer les processus commerciaux, les données client, l’adoption et le reporting."
      gmao: "Cadrer la maintenance, les actifs, les données équipements, la mobilité terrain et la recette."
      finance: "Relier processus finance, ERP/EPM, reporting, contrôle interne et interfaces."
      e_invoice: "Cadrer les flux, formats, plateformes agréées (PA), impacts SI et conduite du changement."
      data_bi: "Définir les indicateurs, modèles de données, dashboards et usages de pilotage."
      ai_automation: "Identifier les usages utiles, automatiser les processus et intégrer les agents métier."
  governance:
    intro: "Missions pour organiser le SI, arbitrer les priorités et tenir l’exécution."
    items:
      strategy: "Établir la cible, la trajectoire, les priorités, le budget et la feuille de route."
      pmo: "Tenir planning, budget, risques, fournisseurs, comités et décisions projet."
      process: "Clarifier les responsabilités, processus, irritants et modes de fonctionnement."
      data_governance: "Structurer référentiels, qualité des données, règles de gestion et responsabilités."
      infrastructure: "Cadrer les scénarios techniques, risques, planning et gouvernance de transition."
      dsi: "Appuyer la direction SI sur priorités, fournisseurs, budget et continuité opérationnelle."
  risk:
    intro: "RGPD, cyber, QSE, PCA/PRA, risques, contrôle interne et IA : obligations, contrôles, preuves et plans d’action."
    items:
      rgpd: "Tenir registre, DPIA, contrats, droits, gouvernance et dispositif DPO."
      cyber: "Structurer gouvernance sécurité, risques, PSSI, ISO 27001, NIS2 et DORA."
      pca: "Identifier les activités critiques, fixer RTO/RPO, formaliser les plans et organiser les tests."
      qse: "Structurer processus, audits, non-conformités, revue de direction et préparation à la certification."
      risk_control: "Cartographier les risques, tester les contrôles et suivre les plans de maîtrise."
      ai_act: "Cadrer usages IA, responsabilités, registres, risques, supervision humaine et preuves."
  mapsi:
    intro: "Plateforme GRC développée par OLING pour outiller registres, risques, audits, plans d’action, incidents et reporting."
    external: "Accéder à mapsi.fr"
    internal: "Voir la page OLING MAPSI"

