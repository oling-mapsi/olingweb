# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
# config/services.yaml
parameters:
    router.request_context.host: 'oling.fr'
    router.request_context.scheme: 'https'
    site_base_url: 'https://oling.fr'
    uploads_dir: '%kernel.project_dir%/public/uploads'
    chat_lead_recipient: 'florestan.rouet@oling.fr'
    chat_ai_provider_default: 'auto'
    chat_ai_openai_base_url_default: 'https://api.openai.com/v1'
    chat_ai_openai_model_default: 'gpt-5.6'
    chat_ai_provider: '%env(default:chat_ai_provider_default:string:CHAT_AI_PROVIDER)%'
    chat_ai_openai_api_key: '%env(default::string:OPENAI_API_KEY)%'
    chat_ai_openai_base_url: '%env(default:chat_ai_openai_base_url_default:string:CHAT_AI_OPENAI_BASE_URL)%'
    chat_ai_openai_model: '%env(default:chat_ai_openai_model_default:string:CHAT_AI_OPENAI_MODEL)%'
    oling_schema_same_as:
        - 'https://www.linkedin.com/company/oling-management-&-technologie/'
        - 'https://twitter.com/oling971'
        - 'https://mapsi.fr/'
        - 'https://web.mapsi.fr/'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    App\Controller\:
        resource: '../src/Controller/'
        tags: ['controller.service_arguments']

    App\EventListener\XRobotsTagListener:
        tags:
            - { name: kernel.event_listener, event: kernel.response }

    App\EventListener\SitemapSubscriber:
        arguments:
            - '@App\Repository\PracticeRepository'
            - '@App\Repository\ServicesRepository'
            - '@App\Repository\SitePageRepository'
            - '@App\Service\PublicSitePageResolver'
        tags:
            - { name: 'kernel.event_subscriber', priority: 100 }

    App\EventListener\CanonicalHostRedirectSubscriber:
        arguments:
            $siteBaseUrl: '%site_base_url%'

    App\Twig\AgencyExtension:
        arguments:
            $siteBaseUrl: '%site_base_url%'

    App\Service\UploadManager:
        arguments:
            $uploadsDir: '%uploads_dir%'

    App\Service\Chat\ChatLeadMailer:
        arguments:
            $recipient: '%chat_lead_recipient%'

    App\Service\Chat\ChatResponder:
        arguments:
            $providers: !tagged_iterator app.chat_ai_provider

    App\Service\Chat\PublicContentCatalog:
        arguments:
            $documentRepository: '@App\Repository\ChatPublicDocumentRepository'
            $indexer: '@App\Service\Chat\ChatPublicContentIndexer'

    App\Service\Chat\Ai\HeuristicAiProvider:
        tags:
            - { name: app.chat_ai_provider, priority: 10 }

    App\Service\Chat\Ai\OpenAiResponsesProvider:
        arguments:
            $mode: '%chat_ai_provider%'
            $apiKey: '%chat_ai_openai_api_key%'
            $baseUrl: '%chat_ai_openai_base_url%'
            $model: '%chat_ai_openai_model%'
        tags:
            - { name: app.chat_ai_provider, priority: 100 }
    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
